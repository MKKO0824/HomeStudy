<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리집 공부방</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#F2F6FB">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--paper:#F2F6FB;--card:#fff;--ink:#1F2A44;--mute:#6B7690;--line:#DFE6F1;--blue:#2F6BFF;--sun:#FFC94A;--sunD:#E9A800;--mint:#16B886;--coral:#FF6B5E;--grape:#7B61FF;--c:#2F6BFF;--cbg:#E6EEFF;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.55}
body{background-image:radial-gradient(#DCE6F4 1.2px,transparent 1.2px);background-size:26px 26px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;color:inherit;background:none}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:-.2px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 20px 70px}
/* 상단 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.logo{font-family:Jua;font-size:26px;display:flex;align-items:center;gap:10px;margin-right:auto}
.logo svg{width:40px;height:40px}
.nav{max-width:100%;overflow-x:auto;display:flex;gap:4px;background:#fff;border-radius:16px;padding:5px;border:2px solid var(--line)}
.nav button{white-space:nowrap;padding:9px 14px;border-radius:11px;font-weight:700;color:var(--mute);font-size:15px}
.nav button.on{background:var(--ink);color:#fff}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff;color:var(--mute);border:1.5px solid var(--line)}
/* 버튼 */
.btn{background:var(--c,var(--blue));color:#fff;padding:13px 22px;border-radius:16px;font-family:Jua;font-size:19px;box-shadow:0 5px 0 rgba(31,42,68,.22);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(31,42,68,.22)}
.btn.bl{--c:var(--blue)}.btn.gr{--c:var(--mint)}.btn.pu{--c:var(--grape)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:16px;border-radius:12px;box-shadow:0 3px 0 rgba(31,42,68,.15)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.45}
.card{background:var(--card);border-radius:var(--r);padding:22px;border:2px solid var(--line)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.muted{color:var(--mute)}.small{font-size:14px;color:var(--mute)}
.empty{text-align:center;padding:46px 20px}.empty .big{font-size:64px}
/* 홈 */
.hello{display:flex;align-items:center;gap:16px;margin:4px 0 22px}
.hello .mascot{width:86px;height:86px;flex:none}
.hello h1{margin:0;font-size:34px}.hello p{margin:2px 0 0;color:var(--mute)}
.kids{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.kid{background:#fff;border-radius:28px;padding:22px 22px 18px;border:2px solid var(--line);position:relative;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 var(--cbg)}
.kid header{display:flex;align-items:center;gap:14px}
.ava{width:64px;height:64px;border-radius:50%;background:var(--cbg);display:grid;place-items:center;font-size:36px;border:3px solid #fff;box-shadow:0 0 0 3px var(--c)}
.kid h2{margin:0;font-size:28px;line-height:1.1}
.trk{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;color:var(--c);background:var(--cbg);padding:3px 10px;border-radius:999px}
.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;border:2px solid var(--line);margin-left:auto}
.topic{font-size:16px}.topic b{font-family:Jua;font-weight:400;font-size:20px;display:block;line-height:1.25}
.topic span{color:var(--mute);font-size:14px}
.path{list-style:none;margin:4px 0 0;padding:6px 4px 0;display:flex;justify-content:space-between;position:relative}
.path::before{content:'';position:absolute;left:30px;right:30px;top:33px;border-top:4px dotted #C9D5E8}
.stone{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:58px}
.stone i{width:54px;height:54px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;background:#EDF2F9;border:3px solid #D5DFEE;display:grid;place-items:center;font-style:normal;font-size:28px;position:relative}
.stone small{font-size:12px;color:var(--mute);font-weight:700}
.stone.done i{background:#fff;border-color:var(--c)}
.stone.done i span{display:inline-block;transform:rotate(-8deg);filter:drop-shadow(0 2px 0 rgba(31,42,68,.15))}
.stone.now i{background:var(--c);border-color:var(--c);color:#fff;font-family:Jua;font-size:22px;box-shadow:0 0 0 6px var(--cbg)}
.stone.now small{color:var(--c)}
.stone.test i{border-style:dashed;border-color:var(--grape)}
.stone.test.now i{background:var(--grape);border-style:solid;box-shadow:0 0 0 6px #ECE7FF}
@media (prefers-reduced-motion:no-preference){.stone.now i{animation:bob 2.4s ease-in-out infinite}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.go{width:100%;background:var(--c);color:#fff;font-family:Jua;font-size:22px;padding:15px;border-radius:18px;box-shadow:0 6px 0 rgba(31,42,68,.25);display:flex;align-items:center;justify-content:center;gap:10px}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(31,42,68,.25)}
.go.test{background:var(--grape)}
.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sub button{font-size:14px;color:var(--mute);padding:7px 10px;border-radius:10px;font-weight:700}
.sub button:hover{background:var(--paper)}
.sub .stk-count{margin-left:auto;font-size:14px;font-weight:700;color:var(--ink)}
.addkid{border:3px dashed #C9D5E8;border-radius:28px;display:grid;place-items:center;min-height:200px;color:var(--mute);font-family:Jua;font-size:20px;background:rgba(255,255,255,.5)}
/* 세션 */
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.who{font-family:Jua;font-size:21px;display:flex;align-items:center;gap:8px}
.steps{display:flex;gap:6px;flex:1;min-width:240px}
.step{flex:1;padding:8px 6px;border-radius:12px;background:#fff;text-align:center;font-size:13px;color:var(--mute);border:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.step.on{border-color:var(--c);color:var(--ink);background:var(--cbg)}.step.ok{background:#E3F7EF;border-color:#BDEBD9;color:#0E8A63}
.timer{font-family:Jua;font-size:20px;background:#fff;padding:7px 14px;border-radius:12px;border:2px solid var(--line)}
.timer.over{background:#FFEDEB;color:var(--coral);border-color:#FFC9C3}
.stage{display:grid;grid-template-columns:1fr;gap:16px}
.stage.withpad{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
@media (max-width:860px){.stage.withpad{grid-template-columns:1fr}}
.qcard{min-height:430px;display:flex;flex-direction:column;gap:16px;border-radius:28px}
.qhead{display:flex;align-items:center;gap:12px}.qnum{font-family:Jua;font-size:18px;color:var(--mute);white-space:nowrap}
.pbar{flex:1;height:12px;background:#EDF2F9;border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .35s}
.qtext{font-size:22px;line-height:1.6}
.qtext .big{font-family:Jua;font-size:46px;letter-spacing:.5px}.qtext .mid{font-family:Jua;font-size:30px}
.qtext .hl{color:var(--coral);text-decoration-thickness:4px;text-underline-offset:6px}
.box{display:inline-block;min-width:1.2em;color:var(--c)}
.center{text-align:center;margin:8px 0}
.vis{max-width:100%;height:auto}
.groups{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}.grp{border:3px dashed #BFD0EE;border-radius:16px;padding:6px 8px;font-size:28px;letter-spacing:2px}
.fr{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;font-family:Jua}.fw{font-size:1.1em}
.fs{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-size:.8em}.fs span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
table.dt,table.gt,table.pg{border-collapse:collapse;margin:0 auto;font-size:17px;background:#fff}
.dt th,.dt td{border:2px solid var(--line);padding:6px 10px;text-align:center}.dt th{background:var(--cbg)}
.gt td{width:58px;height:30px;text-align:center;border:1px solid var(--line);font-size:20px;color:var(--c)}.gt .gl{border:none;color:var(--mute);font-size:13px;width:24px}.gt .gn{font-size:14px;color:var(--ink);border:none}
.pg th,.pg td{border:2px solid var(--line);padding:6px 10px}.pg td:last-child{font-size:30px;text-align:left}.pg .sm{font-size:17px}
.vert{display:inline-block;font-family:Jua;font-size:34px;text-align:right;line-height:1.25}
.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:auto}
.afield{min-width:130px;height:70px;border-radius:18px;border:3px solid var(--line);background:#fff;font-family:Jua;font-size:38px;display:grid;place-items:center;padding:0 14px}
.afield.on{border-color:var(--c);box-shadow:0 0 0 5px var(--cbg)}.alabel{font-family:Jua;font-size:22px;color:var(--mute)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:420px;margin:0 auto;width:100%}
.keypad button{height:62px;border-radius:16px;background:#fff;border:2px solid var(--line);font-family:Jua;font-size:28px;box-shadow:0 4px 0 var(--line)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}.keypad .ok{background:var(--mint);color:#fff;border-color:var(--mint);box-shadow:0 4px 0 #0E8A63}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:auto}
.choices button{min-height:86px;border-radius:20px;background:#fff;border:3px solid var(--line);font-size:20px;font-weight:700;padding:10px;box-shadow:0 5px 0 var(--line);transition:transform .08s}
.choices button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.choices button.sel{border-color:var(--c)}.choices button.right{border-color:var(--mint);background:#E3F7EF;box-shadow:0 5px 0 #BDEBD9}.choices button.wrong{border-color:var(--coral);background:#FFEDEB;box-shadow:0 5px 0 #FFC9C3}
.qtools{display:flex;gap:8px;flex-wrap:wrap}
.hintbox{background:#FFF6DB;border-radius:16px;padding:12px 16px;font-size:17px;border:2px solid #FBE3A2}
.reveal{background:#FFEDEB;border-radius:16px;padding:12px 16px;font-size:18px;border:2px solid #FFC9C3}
.qcard.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
/* 정답 피드백 */
.fb{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40}
.fb .pop{width:150px;height:150px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.fb .msg{position:absolute;top:calc(50% + 82px);font-family:Jua;font-size:28px;color:var(--ink);background:#fff;padding:6px 18px;border-radius:999px;border:2px solid var(--line);animation:pop .6s .05s both}
.fb .cf{position:absolute;width:12px;height:12px;border-radius:3px;top:50%;left:50%;animation:burst .8s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes burst{0%{transform:translate(-50%,-50%) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.fb .pop,.fb .msg,.qcard.shake,.peel{animation:none!important}.fb .cf{display:none}}
/* 연습장 */
.pad{display:flex;flex-direction:column;gap:8px}.pad canvas{width:100%;height:450px;border-radius:20px;background:#fff;touch-action:none;box-shadow:inset 0 0 0 2px var(--line)}
.padbar{display:flex;gap:8px;align-items:center}
/* 유아/한글 */
.hg{font-family:Jua;font-size:60px;line-height:1}.emo{font-size:100px;text-align:center;line-height:1.1}.emo2{font-size:64px}
.hword{font-family:Jua;font-size:74px;text-align:center;letter-spacing:6px}.hsent{font-family:Jua;font-size:48px;text-align:center}
.kobj{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:44px;margin:6px 0}
.kobj span{position:relative;display:inline-block}.kobj .gone{opacity:.5}
.kobj .gone::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;color:var(--coral);font-size:46px;font-weight:900}
.kn{font-family:Jua;font-size:46px}.kseq{display:flex;gap:16px;justify-content:center;align-items:center;font-size:46px}
.kplus{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.kplus b{font-size:44px}
.kbox{font-size:34px;line-height:1.3;word-break:break-all}
.tenf{display:inline-grid;grid-template-columns:repeat(5,52px);gap:4px;background:var(--ink);padding:4px;border-radius:10px}.tenf span{height:52px;background:#fff;display:grid;place-items:center;font-size:30px;border-radius:5px}
.speak{background:var(--cbg);color:var(--ink);border-radius:999px;padding:10px 20px;font-size:18px;font-weight:700;border:2px solid transparent}
.speak:active{border-color:var(--c)}
.build{display:flex;flex-direction:column;gap:12px;align-items:center}
.bprev{width:150px;height:150px;border-radius:28px;background:#fff;border:4px dashed var(--c);display:grid;place-items:center;font-family:Jua;font-size:100px}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.tiles .lab{width:100%;text-align:center;font-size:14px;color:var(--mute)}
.tiles button{width:78px;height:78px;border-radius:20px;background:#fff;border:3px solid var(--line);font-family:Jua;font-size:42px;box-shadow:0 4px 0 var(--line)}
.tiles button.on{border-color:var(--c);background:var(--cbg)}.tiles button.t2{font-size:20px}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lc{background:#fff;border-radius:24px;padding:18px;text-align:center;border:3px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 5px 0 var(--line)}
.lc:active{transform:translateY(3px)}
.lc .g{font-family:Jua;font-size:100px;line-height:1.05;color:var(--c)}.lc .g.w{font-size:54px}.lc .g.s{font-size:36px}.lc .sub{font-family:Jua;font-size:26px;color:var(--ink)}
.lc .ex{font-size:20px}.lc .ex span{font-size:40px}
.chart{border-collapse:collapse;margin:0 auto}.chart td,.chart th{border:2px solid var(--line);width:62px;height:62px;text-align:center;font-family:Jua;font-size:32px;background:#fff}.chart th{background:var(--cbg);font-size:24px}
.chart td:active{background:var(--cbg)}
.trace canvas{width:100%;max-width:520px;aspect-ratio:1;display:block;margin:0 auto;background:#fff;border-radius:24px;touch-action:none;box-shadow:inset 0 0 0 3px var(--line)}
.concept{display:grid;gap:12px}.cc{background:#fff;border-radius:20px;padding:16px 20px;border:2px solid var(--line);border-left:10px solid var(--c)}
.cc h3{margin:0 0 6px;font-size:24px}.cc p{margin:0 0 8px;font-size:19px;line-height:1.65}.cc pre{margin:0;background:var(--cbg);border-radius:12px;padding:10px 14px;font-family:Jua;font-size:22px;white-space:pre-wrap}
.guide{background:var(--paper);border-radius:14px;padding:10px 14px;font-size:15px;color:var(--mute)}
.psg{background:#FBFCFF;border:2px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:12px;font-size:19px;line-height:1.8}
.psgt{font-family:Jua;font-size:20px;color:var(--c);margin-bottom:6px}.poem{font-family:Jua;font-size:24px;line-height:1.7}
.sp_{color:#B7C3D8;font-size:13px;margin:0 1px}
/* 정리·스티커 */
.sum{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;border-radius:30px;padding:30px 22px}
.sum h2{margin:0;font-size:30px}
.stkbig{width:170px;height:170px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:96px;border:8px solid #fff;box-shadow:0 0 0 4px var(--sun),0 10px 0 rgba(31,42,68,.12);transform:rotate(-6deg)}
.stkbig.gold{box-shadow:0 0 0 5px var(--grape),0 10px 0 rgba(31,42,68,.12);background:radial-gradient(circle at 30% 25%,#fff,#F1EDFF)}
@media (prefers-reduced-motion:no-preference){.peel{animation:peel .9s cubic-bezier(.2,1.4,.4,1) both}}
@keyframes peel{0%{transform:rotate(-40deg) scale(.2);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:1}}
.stars{font-size:44px;letter-spacing:6px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.stat div{background:var(--paper);border-radius:18px;padding:12px}.stat b{display:block;font-family:Jua;font-size:30px}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.stkgrid span{aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:34px;border:4px solid #fff;box-shadow:0 0 0 2px var(--sun)}
.stkgrid span:nth-child(3n){transform:rotate(-7deg)}.stkgrid span:nth-child(3n+1){transform:rotate(5deg)}
.stkgrid span.gold{box-shadow:0 0 0 3px var(--grape)}
.stkgrid span.blank{box-shadow:none;border:3px dashed #D5DFEE;background:transparent}
/* 리포트 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:#fff;border-radius:18px;padding:14px 16px;border:2px solid var(--line)}.kpi b{display:block;font-family:Jua;font-size:30px}.kpi span{font-size:13px;color:var(--mute)}
table.rt{width:100%;border-collapse:collapse;font-size:15px}.rt th,.rt td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}.rt th{color:var(--mute);font-weight:700;font-size:13px}
.bar{height:10px;border-radius:6px;background:#EDF2F9;overflow:hidden;min-width:80px}.bar i{display:block;height:100%}
.lv{font-size:12px;padding:3px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
.sec{margin:26px 0 10px;font-family:Jua;font-size:24px}
.lsel{display:flex;gap:8px;flex-wrap:wrap}.lsel button{padding:8px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700}.lsel button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.mcard h3{margin:0 0 8px}
.tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs2 button{padding:8px 16px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700}.tabs2 button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.cur td{vertical-align:top}.cur tr.mon td{background:#F3F0FF;font-weight:700;color:var(--grape)}.cur td:first-child{white-space:nowrap}
textarea,input[type=text],input[type=number],select{font-family:inherit;font-size:17px;padding:11px 13px;border-radius:14px;border:2px solid var(--line);width:100%;background:#fff;color:var(--ink)}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(31,42,68,.45);display:grid;place-items:center;z-index:50;padding:16px}.modal.hidden{display:none}
.mbox{background:#fff;border-radius:28px;padding:24px;max-width:580px;width:100%;max-height:90vh;overflow:auto}
.mbox h2{margin:0 0 12px;font-size:26px}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt button{padding:14px;border-radius:18px;border:3px solid var(--line);background:#fff;text-align:left}.opt button.on{border-color:var(--blue);background:#F1F5FF}
.opt b{display:block;font-size:16px}.opt span{font-size:13px;color:var(--mute)}
.field{margin:14px 0}.field label{display:block;font-size:14px;color:var(--mute);margin-bottom:6px;font-weight:700}
.emo-pick{display:flex;gap:8px;flex-wrap:wrap}.emo-pick button{width:52px;height:52px;border-radius:50%;font-size:28px;background:var(--paper);border:3px solid transparent}.emo-pick button.on{border-color:var(--blue);background:#fff}
/* 학습지·채점 */
.sheet{background:#fff;border-radius:18px;padding:22px;max-height:65vh;overflow:auto;border:2px solid var(--line)}
.grade{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.grade .q{flex:1;font-size:15px}.grade .q .big,.grade .q .mid{font-size:20px;font-family:Jua}.grade .q svg,.grade .q table,.grade .q .kobj{display:none}
.grade .a{font-family:Jua;font-size:20px;color:var(--blue);min-width:90px;text-align:right}
.ox{display:flex;gap:6px}.ox button{width:52px;height:46px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px}
.ox button.o.on{background:#E3F7EF;border-color:var(--mint)}.ox button.x.on{background:#FFEDEB;border-color:var(--coral)}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;z-index:60;font-size:15px;max-width:90vw}
@media (max-width:600px){.top .nav{width:100%}.nav button{flex:1}.hello h1{font-size:26px}.kids{grid-template-columns:1fr}.stone{width:52px}.stone i{width:46px;height:46px;font-size:24px}.qtext .big{font-size:36px}.nav button{padding:8px 10px;font-size:14px}}
.login{max-width:440px;margin:6vh auto 0;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.login .mascot{width:110px;height:110px}.login h1{margin:0;font-size:34px}.login .card{width:100%;text-align:left}
.login a{color:var(--blue)}
input[type=email]{font-family:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);width:100%;background:#fff;color:var(--ink)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.STANDALONE=true;
// ================= 공통 유틸 =================
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hasJong(w){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
const J=(w,a,b)=>w+(hasJong(w)?a:b);
const KIDS=['지우','수아','시우','지호','서아','유나','도하','하루','예서','주아'];
const ITEMS=[['사탕','개'],['구슬','개'],['색종이','장'],['연필','자루'],['딱지','장'],['스티커','장'],['쿠키','개'],['귤','개'],['풍선','개'],['공책','권']];
const kid=()=>pick(KIDS);
const two=()=>{const a=shuffle(KIDS);return [a[0],a[1]];};

function P(skill,q,a,o={}){return Object.assign({skill,q,a:String(a),kind:'num'},o);}
function C(skill,q,a,choices,o={}){const ch=choices.map(c=>typeof c==='object'?c:{v:String(c),h:esc(String(c))});return Object.assign({skill,q,a:String(a),kind:'choice',choices:shuffle(ch)},o);}
function M(skill,q,answers,labels,o={}){return Object.assign({skill,q,a:answers.map(String),kind:'multi',labels},o);}
function numCh(ans,spread,count=4,min=0){const s=new Set([ans]);let g=0;while(s.size<count&&g++<300){const v=ans+R(-spread,spread);if(v>=min)s.add(v);}return [...s];}
function bx(){return '<span class="box">□</span>';}

// ---------- 시각 자료 ----------
function frac(a,b,w){return `<span class="fr">${w?`<span class="fw">${w}</span>`:''}<span class="fs"><span>${a}</span><span>${b}</span></span></span>`;}
function fracBar(n,k){const W=280,H=46;let s=`<svg class="vis" viewBox="0 0 ${W+4} ${H+4}" width="${W}">`;for(let i=0;i<n;i++){s+=`<rect x="${2+i*W/n}" y="2" width="${W/n}" height="${H}" fill="${i<k?'#FFB547':'#fff'}" stroke="#333" stroke-width="2"/>`;}return s+'</svg>';}
function clockSVG(h,m){let s=`<svg class="vis clock" viewBox="0 0 200 200" width="190"><circle cx="100" cy="100" r="94" fill="#fff" stroke="#333" stroke-width="5"/>`;
 for(let i=0;i<60;i++){const a=(i*6-90)*Math.PI/180,r1=i%5?86:80;s+=`<line x1="${(100+r1*Math.cos(a)).toFixed(1)}" y1="${(100+r1*Math.sin(a)).toFixed(1)}" x2="${(100+91*Math.cos(a)).toFixed(1)}" y2="${(100+91*Math.sin(a)).toFixed(1)}" stroke="#333" stroke-width="${i%5?1:3}"/>`;}
 for(let i=1;i<=12;i++){const a=(i*30-90)*Math.PI/180;s+=`<text x="${(100+66*Math.cos(a)).toFixed(1)}" y="${(100+66*Math.sin(a)+7).toFixed(1)}" text-anchor="middle" font-size="20" font-family="Jua,sans-serif">${i}</text>`;}
 const ha=((h%12)*30+m*0.5-90)*Math.PI/180,ma=(m*6-90)*Math.PI/180;
 s+=`<line x1="100" y1="100" x2="${(100+44*Math.cos(ha)).toFixed(1)}" y2="${(100+44*Math.sin(ha)).toFixed(1)}" stroke="#E4572E" stroke-width="8" stroke-linecap="round"/>`;
 s+=`<line x1="100" y1="100" x2="${(100+70*Math.cos(ma)).toFixed(1)}" y2="${(100+70*Math.sin(ma)).toFixed(1)}" stroke="#2D3047" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#333"/></svg>`;return s;}
function polySVG(n,size=90,fill='#CDE7FF'){if(n===0)return `<svg class="vis" viewBox="0 0 100 100" width="${size}"><circle cx="50" cy="50" r="42" fill="${fill}" stroke="#333" stroke-width="3"/></svg>`;
 let p=[];for(let i=0;i<n;i++){const a=(i*360/n-90)*Math.PI/180;p.push((50+42*Math.cos(a)).toFixed(1)+','+(54+42*Math.sin(a)).toFixed(1));}
 return `<svg class="vis" viewBox="0 0 100 100" width="${size}"><polygon points="${p.join(' ')}" fill="${fill}" stroke="#333" stroke-width="3"/></svg>`;}
function shapeSVG(kind,size=110){const S={
 '직각삼각형':'<polygon points="15,85 15,15 85,85" fill="#FFE0B2" stroke="#333" stroke-width="3"/><polyline points="15,72 28,72 28,85" fill="none" stroke="#333" stroke-width="2"/>',
 '직사각형':'<rect x="8" y="25" width="84" height="50" fill="#C8E6C9" stroke="#333" stroke-width="3"/>',
 '정사각형':'<rect x="18" y="18" width="64" height="64" fill="#BBDEFB" stroke="#333" stroke-width="3"/>',
 '삼각형':'<polygon points="50,12 88,85 12,85" fill="#F8BBD0" stroke="#333" stroke-width="3"/>',
 '원':'<circle cx="50" cy="50" r="40" fill="#FFF59D" stroke="#333" stroke-width="3"/>'};
 return `<svg class="vis" viewBox="0 0 100 100" width="${size}">${S[kind]}</svg>`;}
function rulerSVG(n){const u=26,W=u*12+30;let s=`<svg class="vis" viewBox="0 0 ${W} 90" width="${Math.min(W,380)}"><rect x="15" y="10" width="${u*n}" height="18" rx="4" fill="#FF8A65"/><rect x="5" y="40" width="${u*12+20}" height="44" fill="#FFF3C4" stroke="#C9A227"/>`;
 for(let i=0;i<=12;i++){s+=`<line x1="${15+i*u}" y1="40" x2="${15+i*u}" y2="58" stroke="#333" stroke-width="2"/><text x="${15+i*u}" y="76" font-size="13" text-anchor="middle">${i}</text>`;}
 return s+'</svg>';}
function groupsHTML(e,g,p){return `<div class="groups">${Array.from({length:g},()=>`<span class="grp">${e.repeat(p)}</span>`).join('')}</div>`;}
function vert(a,op,b){return `<div class="vert"><div>${a}</div><div><span class="op">${op}</span>${b}</div><div class="vline"></div><div class="vq">?</div></div>`;}

const G={};
// ================= 2학년 =================
G.m2_place3=lv=>{const t=R(0,2);
 if(t===0){const h=R(1,9),te=R(0,9),o=R(0,9);return P('m2_place3',`100이 <b>${h}</b>개, 10이 <b>${te}</b>개, 1이 <b>${o}</b>개인 수는?`,h*100+te*10+o,{hint:'백의 자리, 십의 자리, 일의 자리 순서로 숫자를 써요.'});}
 if(t===1){let n,d,i;do{n=R(101,999);d=String(n);i=R(0,2);}while(d[i]==='0');
  const html=d.split('').map((c,j)=>j===i?`<u class="hl">${c}</u>`:c).join('');
  return P('m2_place3',`<span class="big">${html}</span><br>밑줄 친 숫자는 얼마를 나타내나요?`,(+d[i])*[100,10,1][i],{hint:'백의 자리 숫자는 100이 몇 개, 십의 자리 숫자는 10이 몇 개인지 나타내요.'});}
 if(lv===1||Math.random()<0.4){return P('m2_place3','100은 10이 몇 개인 수인가요?',10,{hint:'10, 20, 30 … 하고 세어 봐요.'});}
 const n=R(11,60);return P('m2_place3',`10이 <b>${n}</b>개인 수는?`,n*10,{hint:'10이 10개면 100이에요.'});};
G.m2_compare3=lv=>{let a=R(100,999),b;
 if(lv>=2){const d=String(a),pos=R(1,2);b=+(d.slice(0,pos)+String(R(100,999)).slice(pos));}else b=R(100,999);
 if(Math.random()<0.08)b=a;const ans=a>b?'>':a<b?'<':'=';
 return C('m2_compare3',`<span class="big">${a} ○ ${b}</span><br>○ 안에 알맞은 기호는?`,ans,['>','<','='],{hint:'백의 자리부터 차례로 비교해요.'});};
G.m2_skip=lv=>{for(;;){const step=pick(lv===1?[1,10]:[1,10,100]);const up=Math.random()<0.65;const s=R(100,999);
 const seq=[0,1,2,3,4].map(i=>up?s+i*step:s-i*step);if(seq.some(v=>v<100||v>999))continue;
 const miss=R(2,4);const show=seq.map((v,i)=>i===miss?bx():v).join(' → ');
 return P('m2_skip',`<span class="mid">${show}</span><br>규칙에 맞게 □에 알맞은 수는?`,seq[miss],{hint:'앞의 두 수가 얼마씩 커지는지(작아지는지) 살펴봐요.'});}};
G.m2_money=lv=>{const t=R(0,1);if(t===0){const a=R(1,9),b=R(0,9),c=R(0,9);return P('m2_money',`100원짜리 동전 ${a}개, 10원짜리 동전 ${b}개, 1원짜리 동전 ${c}개가 있어요. 모두 얼마인가요? (원)`,a*100+b*10+c,{hint:'100원짜리 개수는 백의 자리, 10원짜리 개수는 십의 자리예요.'});}
 const a=R(2,9),b=R(1,9);const [x,u]=pick(ITEMS);return P('m2_money',`${J(x,'이','가')} 한 상자에 100${u}씩 ${a}상자, 낱개로 ${b}${u} 있어요. ${J(x,'은','는')} 모두 몇 ${u}인가요?`,a*100+b,{hint:'100이 몇 개, 1이 몇 개인지 생각해요.'});};
G.m2_add2=lv=>{let a,b;do{if(lv===1){a=R(11,89);b=R(2,9);}else if(lv===2){a=R(11,88);b=R(11,88);}else{a=R(25,99);b=R(25,99);}}while((a%10)+(b%10)<10||(lv<3&&a+b>=100));
 return P('m2_add2',`<span class="big">${a} + ${b} = □</span>`,a+b,{hint:'일의 자리끼리 더해 10이 넘으면 십의 자리로 1을 받아올려요.',col:[a,'+',b]});};
G.m2_sub2=lv=>{let a,b;do{if(lv===1){a=R(20,99);b=R(2,9);}else if(lv===2){a=R(30,99);b=R(11,a-5);}else{a=pick([R(30,99),R(3,9)*10]);b=R(11,a-3);}}while(a%10>=b%10||b<=0||a-b<=0);
 return P('m2_sub2',`<span class="big">${a} − ${b} = □</span>`,a-b,{hint:'일의 자리끼리 뺄 수 없으면 십의 자리에서 10을 받아내려요.',col:[a,'−',b]});};
G.m2_three=lv=>{for(;;){const t=R(0,2);const a=R(10,60),b=R(5,30),c=R(3,25);let v,s;
 if(t===0){v=a+b-c;s=`${a} + ${b} − ${c}`;}else if(t===1){v=a-b+c;s=`${a} − ${b} + ${c}`;}else{v=a+b+c;s=`${a} + ${b} + ${c}`;}
 if(v<0||v>99||a-b<0)continue;return P('m2_three',`<span class="big">${s} = □</span>`,v,{hint:'앞에서부터 두 수씩 차례로 계산해요.'});}};
G.m2_addw=lv=>{const [x,u]=pick(ITEMS);const n=kid();const t=R(0,3);let a,b;do{a=R(15,68);b=R(12,40);}while(a+b>=100||(a%10)+(b%10)<10);
 if(t===0)return P('m2_addw',`${n}는 ${J(x,'을','를')} ${a}${u} 가지고 있었는데 ${b}${u}를 더 받았어요. ${J(x,'은','는')} 모두 몇 ${u}인가요?`,a+b,{hint:'더 받았으니 덧셈을 해요.'});
 if(t===1){const [p,q]=two();return P('m2_addw',`줄넘기를 ${p}는 ${a}번, ${q}는 ${b}번 했어요. 두 사람은 모두 몇 번 했나요?`,a+b,{hint:'모두 = 더하기'});}
 if(t===2)return P('m2_addw',`버스에 ${a}명이 타고 있었어요. 정류장에서 ${b}명이 더 탔어요. 지금 버스에는 몇 명이 타고 있나요?`,a+b);
 return P('m2_addw',`화단에 빨간 꽃이 ${a}송이, 노란 꽃이 ${b}송이 피었어요. 꽃은 모두 몇 송이인가요?`,a+b);};
G.m2_subw=lv=>{const [x,u]=pick(ITEMS);const t=R(0,3);let a,b;do{a=R(30,95);b=R(11,a-5);}while(a%10>=b%10);
 if(t===0)return P('m2_subw',`${kid()}는 ${J(x,'을','를')} ${a}${u} 가지고 있었는데, 동생에게 ${b}${u}를 주었어요. 남은 ${J(x,'은','는')} 몇 ${u}인가요?`,a-b,{hint:'주고 남은 것 = 빼기'});
 if(t===1){const [p,q]=two();return P('m2_subw',`${p}는 딱지를 ${a}장, ${q}는 ${b}장 가지고 있어요. ${p}는 ${q}보다 몇 장 더 많이 가지고 있나요?`,a-b,{hint:'얼마나 더 많은지 = 큰 수 − 작은 수'});}
 if(t===2)return P('m2_subw',`버스에 ${a}명이 타고 있었는데 ${b}명이 내렸어요. 버스에 남은 사람은 몇 명인가요?`,a-b);
 const c=R(5,20);return P('m2_subw',`색종이가 ${a}장 있었어요. 미술 시간에 ${b}장을 쓰고, ${c}장을 새로 샀어요. 지금 색종이는 몇 장인가요?`,a-b+c,{hint:'먼저 뺀 다음 더해요.'});};
G.m2_shape=lv=>{if(Math.random()<0.45){const pool=[[3,'삼각형'],[4,'사각형'],[5,'오각형'],[6,'육각형'],[0,'원']];const s=pick(pool);
  return C('m2_shape',`<div class="center">${polySVG(s[0],110)}</div>이 도형의 이름은?`,s[1],[s[1],...shuffle(pool.map(p=>p[1]).filter(v=>v!==s[1])).slice(0,3)],{hint:'변(곧은 선)이 몇 개인지 세어 봐요.'});}
 const bank=[['삼각형의 꼭짓점은 몇 개인가요?',3],['사각형의 변은 몇 개인가요?',4],['원의 꼭짓점은 몇 개인가요?',0],['오각형의 변은 몇 개인가요?',5],['육각형의 꼭짓점은 몇 개인가요?',6],['삼각형 2개의 변은 모두 몇 개인가요?',6],['사각형 3개의 꼭짓점은 모두 몇 개인가요?',12],['오각형과 삼각형의 변은 모두 몇 개인가요?',8]];
 const q=pick(bank);return P('m2_shape',q[0],q[1],{hint:'삼각형 3, 사각형 4, 오각형 5, 육각형 6 — 원은 꼭짓점이 없어요.'});};
G.m2_cm=lv=>{const t=R(0,2);if(t===0){const n=R(2,11);return P('m2_cm',`<div class="center">${rulerSVG(n)}</div>색 막대의 길이는 몇 cm인가요?`,n,{hint:'0부터 막대 끝까지 1cm 눈금이 몇 칸인지 세어요.'});}
 if(t===1){const a=R(5,40),b=R(5,40);return P('m2_cm',`<span class="big">${a}cm + ${b}cm = □cm</span>`,a+b);}
 const a=R(20,60),b=R(3,a-5);return P('m2_cm',`<span class="big">${a}cm − ${b}cm = □cm</span>`,a-b);};
G.m2_cmw=lv=>{const t=R(0,2);if(t===0){const a=R(8,30),b=R(5,25);return P('m2_cmw',`길이가 ${a}cm인 끈과 ${b}cm인 끈을 겹치지 않게 이었어요. 이은 끈의 길이는 몇 cm인가요?`,a+b);}
 if(t===1){const a=R(30,80),b=R(10,a-5);return P('m2_cmw',`${a}cm인 리본에서 ${b}cm를 잘라 썼어요. 남은 리본은 몇 cm인가요?`,a-b);}
 const a=R(10,19),b=R(2,4);return P('m2_cmw',`한 뼘이 ${a}cm인 ${kid()}가 책상 길이를 재었더니 ${b}뼘이었어요. 책상 길이는 몇 cm쯤인가요? (덧셈으로 구해요)`,a*b,{hint:`${a}cm를 ${b}번 더해요.`});};
G.m2_mulbase=lv=>{const t=R(0,3);const e=pick(['🍎','🐟','⭐','🍓','🚗','🌷']);
 if(t===0){const g=R(2,lv===1?4:5),p=R(2,5);return P('m2_mulbase',`${groupsHTML(e,g,p)}${p}씩 ${g}묶음은 모두 몇 개인가요?`,g*p,{hint:`${p}, ${p*2}, ${p*3} … 하고 뛰어 세어요.`});}
 if(t===1){const a=R(2,9),b=R(2,5);return P('m2_mulbase',`${a}의 ${b}배는 얼마인가요?`,a*b,{hint:`${a}를 ${b}번 더해요.`});}
 if(t===2){const a=R(2,9),b=R(3,6);return P('m2_mulbase',`<span class="mid">${Array(b).fill(a).join(' + ')} = ${a} × □</span>`,b,{hint:`${a}를 몇 번 더했는지 세어요.`});}
 const a=R(2,9),b=R(2,6);return C('m2_mulbase',`${a}씩 ${b}묶음을 곱셈식으로 나타내면?`,`${a} × ${b}`,[`${a} × ${b}`,`${a} + ${b}`,`${a} × ${a}`,`${b} + ${b}`].filter((v,i,s)=>s.indexOf(v)===i),{hint:'몇씩 몇 묶음 = (몇) × (묶음 수)'});};
function timesGen(skill,dans){return lv=>{const a=pick(dans),b=R(lv===1?1:2,9);let t=lv===3?R(0,2):lv===2?R(0,1)*R(0,1):0;if(a===0&&t>0)t=0;

function spaceVariants(s){const w=s.split(' ');const out=new Set();let g=0;while(out.size<2&&g++<40){if(Math.random()<0.5&&w.length>1){const i=R(0,w.length-2);const v=w.slice();v.splice(i,2,w[i]+w[i+1]);out.add(v.join(' '));}else{const i=R(0,w.length-1);const word=w[i].replace(/[.,?!]$/,'');if(word.length<3)continue;const k=R(1,word.length-1);const v=w.slice();v[i]=w[i].slice(0,k)+' '+w[i].slice(k);out.add(v.join(' '));}}return [...out];}

  const [ls,rs]=await Promise.all([db.collection('learners').get(),db.collection('records').limit(1000).get()]);
  const L={},Rc={};ls.docs.forEach(d=>{if(d.exists)L[d.id]=d.data();});rs.docs.forEach(d=>{if(d.exists)Rc[d.id]=d.data();});
  this.db=db;this.mode='cloud';const push=[];
  for(const id in this.S.learners){const a=this.S.learners[id],b=L[id];if(!b||(a.updatedAt||0)>(b.updatedAt||0)){L[id]=a;push.push(['learners',id,a]);}}
  for(const id in this.S.records){if(!Rc[id]){Rc[id]=this.S.records[id];push.push(['records',id,Rc[id]]);}}
  this.S={learners:JSON.parse(JSON.stringify(L)),records:JSON.parse(JSON.stringify(Rc))};this.saveLocal();
  for(const [c,i,o] of push)this.write(c,i,o);
  App.render();}catch(e){console.warn('db',e);this.mode='local';App.status();}},
 write(col,id,obj){if(!this.db)return;const key=col+'/'+id;const prev=this.q[key]||Promise.resolve();
  this.q[key]=prev.then(()=>this.db.collection(col).doc(id).set(JSON.parse(JSON.stringify(obj)))).catch(e=>{console.warn(e);if(e&&e.code==='quota_exceeded')toast('저장 공간이 가득 찼어요.');});},
 put(col,id,obj){this.S[col][id]=obj;this.saveLocal();this.write(col,id,obj);},
 del(col,id){delete this.S[col][id];this.saveLocal();if(this.db){this.db.collection(col).doc(id).delete().catch(()=>{});}}};
function waitClaude(){if(window.STANDALONE)return Promise.resolve(null);return new Promise(res=>{let n=0;const t=()=>{if(window.claude&&typeof window.claude.use==='function')return res(window.claude);if(++n>40)return res(null);setTimeout(t,150);};t();});}

async function saveFile(filename,data,mime){try{const c=await waitClaude();const d=c&&await c.use('downloads');if(d){await d.save({filename,data});return true;}}catch(e){}
 try{const url=URL.createObjectURL(new Blob([data],{type:mime||'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);return true;}catch(e){return false;}}

function plan(L){const week=Math.floor(L.done/5)+1,day=L.done%5+1;const sw=L.startWeek||1;const rel=week-sw;return {week,day,kind:day===5?((rel+1)%4===0&&rel>=0?'month':'week'):'study',month:Math.floor(Math.max(0,rel)/4)+1};}

function recsOf(id){return Object.values(Store.S.records).filter(r=>r.learnerId===id).sort((a,b)=>(a.ts||0)-(b.ts||0));}
function skillAgg(recs){const A={};recs.forEach(r=>{for(const s in (r.skills||{})){A[s]=A[s]||[0,0];A[s][0]+=r.skills[s][0];A[s][1]+=r.skills[s][1];}});return A;}
function weakSkills(L){const A=skillAgg(recsOf(L.id).slice(-15));return Object.entries(A).filter(([s,[c,t]])=>t>=5&&c/t<0.75&&G[s]).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(x=>x[0]);}
function lvOf(wi,w,day){const f=(wi*5+day-1)/(w*5);return f<0.3?1:f<0.65?2:3;}
function gen(skills,lv,n){const out=[];for(let i=0;i<n;i++){const s=skills[i%skills.length];out.push(G[s](typeof lv==='function'?lv(i):lv));}return out;}

function buildSession(L){const p=plan(L);return L.track==='hangul'?buildHangul(L,p):L.track==='kor2'?buildKor(L,p):buildMath(L,p);}
function buildMath(L,{week,day,kind,month}){const tr=L.track;const {u,ui,wi,us}=unitAt(tr,week);
 const allC=uniq(us.flatMap(x=>x.calc)),allW=uniq(us.flatMap(x=>x.word));
 const calc=u?u.calc:allC,word=u?u.word:allW,lv=u?lvOf(wi,u.w||2,day):3;
 const weak=weakSkills(L).filter(s=>s.startsWith('m'));const prev=ui>0?uniq(us.slice(Math.max(0,ui-3),ui).flatMap(x=>x.calc)):(u?u.calc:allC);
 const warm=gen(shuffle(weak.length?weak.slice(0,3).concat(prev):prev),weak.length?2:(ui>0?2:1),6);
 const title=uLabel(u);
 if(kind==='study')return {title,blocks:[
  {type:'quiz',title:'워밍업',mins:5,mode:'practice',items:warm,note:weak.length?'지난 기록에서 약했던 부분을 먼저 복습해요.':'앞 단원 복습으로 머리를 깨워요.'},
  {type:'concept',title:'개념 익히기',mins:10,cards:u?u.c:[['총복습','지금까지 배운 내용을 섞어서 풀어요. 틀린 문제는 연습장에 다시 풀어 보세요.','']]},
  {type:'quiz',title:'연습 문제',mins:20,mode:'practice',items:gen(shuffle(calc),lv,15)},
  {type:'quiz',title:'응용 문제',mins:15,mode:'practice',items:gen(shuffle(word),lv,5)},
  {type:'summary',title:'정리'}]};
 if(kind==='week'){const wk=uniq([week-1,week].map(w=>unitAt(tr,Math.max(1,w)).ui)).map(i=>i<0?null:us[i]);const wc=uniq(wk.flatMap(x=>x?x.calc:allC)),ww=uniq(wk.flatMap(x=>x?x.word:allW));
  return {title:`${week}주차 주간 평가 · ${title}`,blocks:[
  {type:'quiz',title:'몸풀기',mins:5,mode:'practice',items:warm.slice(0,4)},
  {type:'quiz',title:'주간 평가',mins:35,mode:'test',items:shuffle(gen(shuffle(wc),i=>[1,2,2,3][i%4],14).concat(gen(shuffle(ww),i=>[2,3][i%2],6)))},
  {type:'summary',title:'결과'}]};}
 const uis=uniq([week-3,week-2,week-1,week].map(w=>unitAt(tr,Math.max(1,w)).ui));const uc=uis.flatMap(i=>i<0?allC:us[i].calc),uw=uis.flatMap(i=>i<0?allW:us[i].word);
 return {title:`${month}월차 월간 평가 (${uis.filter(i=>i>=0).map(i=>us[i].t).join(', ')||'총복습'})`,blocks:[
  {type:'quiz',title:'월간 평가 ①',mins:25,mode:'test',items:gen(shuffle(uniq(uc)),i=>[2,2,3][i%3],20)},
  {type:'quiz',title:'월간 평가 ②',mins:20,mode:'test',items:gen(shuffle(uniq(uw)),i=>[2,3][i%2],10)},
  {type:'summary',title:'결과'}]};}
function buildKor(L,{week,day,kind,month}){const {u}=unitAt('kor2',week);const U=u||KPREP[(week-1)%KPREP.length];
 const weak=weakSkills(L).filter(s=>s.startsWith('g_')&&s!=='g_dict');const rev=uniq(['g_spell','g_conf','g_space'].concat(weak.slice(0,2)));
 const dict=n=>shuffle(KDICT).slice(0,n).map(s=>({skill:'g_dict',kind:'dict',q:'잘 듣고 받아써요',say:s,a:s,tag:s}));
 if(kind==='study')return {title:uLabel(U),blocks:[
  {type:'quiz',title:'받아쓰기',mins:10,mode:'practice',items:dict(5),note:'문장을 듣고 아래 칸(또는 공책)에 또박또박 써요.'},

  {type:'quiz',title:'맞춤법 복습',mins:5,mode:'practice',items:gen(shuffle(rev),2,5)},
  {type:'summary',title:'정리'}]};
 const big=kind==='month';const ws=big?[week-3,week-2,week-1,week]:[week-1,week];const wk=uniq(ws.map(w=>unitAt('kor2',Math.max(1,w)).u).filter(Boolean));const sk=uniq((wk.length?wk:[U]).flatMap(x=>x.skills));
 return {title:big?`${month}월차 월간 평가 (국어)`:`${week}주차 주간 평가 · ${uLabel(U)}`,blocks:[

function buildHangul(L,{week,day,kind,month}){const W=hWeek(week);const K=hKnown(week,day);

 Object.assign(L,{name,track:tr,emoji:em,updatedAt:Date.now()});if(changedWeek){L.done=(wk-1)*5;L.startWeek=wk;}Store.put('learners',L.id,L);App.render();}

 else if(n>=5){const c=await modal('<h2>이번 주 5회를 모두 마쳤어요 🎉</h2><p>주 5회가 목표예요. 쉬는 것도 공부예요! 그래도 진행할까요?</p>',[{t:'쉬기',v:0,cls:'ghost'},{t:'진행',v:1}]);if(!c.v)return;}
 Voice.say('');const S=buildSession(L);S.L=L;S.plan=plan(L);S.mode=mode;S.start=Date.now();S.bi=0;S.res=[];S.trace=0;App.sess=S;App.view='session';
 if(mode==='paper')return paperView(S);runSession();}

 app.innerHTML=`<div class="wrap" style="--c:${T.color};--cbg:${T.bg}"><div class="sbar"><button class="btn ghost sm" id="quit">✕ 그만하기</button><div class="who">${S.L.emoji||T.av} ${esc(S.L.name)}</div><div class="steps">${S.blocks.map((b,i)=>`<div class="step" data-s="${i}">${b.title}</div>`).join('')}</div><div class="timer" id="tm">00:00</div></div><div class="small" style="margin:-6px 0 12px">${esc(S.title)}</div><div id="blk"></div></div>`;
 $('#quit').onclick=async()=>{const c=await modal('<h2>공부를 멈출까요?</h2><p>지금까지 푼 내용은 저장되지 않아요. 회차도 넘어가지 않아요.</p>',[{t:'계속하기',v:0},{t:'그만하기',v:1,cls:'ghost'}]);if(c.v){clearInterval(timerInt);App.sess=null;App.go('home');}};
 clearInterval(timerInt);timerInt=setInterval(()=>{const s=Math.floor((Date.now()-S.start)/1000);const e=$('#tm');if(!e)return clearInterval(timerInt);e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');e.classList.toggle('over',s>=3600);
  if(s===3600)toast('1시간이 되었어요. 오늘은 여기까지 해도 좋아요!');},1000);

 <div class="pad" style="margin-top:14px"><div class="padbar"><b>✏️ 연습장</b><span class="small">예시를 직접 따라 써 보세요</span><div class="sp"></div><button class="btn ghost sm" id="pclr">지우기</button></div><canvas id="pc" style="height:320px"></canvas></div>

function blockLearn(el,b){el.innerHTML=`<div class="card"><div class="guide">👨‍👩‍👧 보호자 가이드: 카드를 눌러 소리를 듣고 아이가 따라 말하게 해 주세요. 그림 낱말의 첫소리를 강조해서 읽어 주면 좋아요.</div>
 <div class="lcards" style="margin-top:14px">${b.cards.map((c,i)=>c.chart?chartHTML(c.chart):`<button class="lc" data-c="${i}"><div class="g ${c.word?'w':''} ${c.sent?'s':''}">${c.g}</div>${c.gsub?`<div class="small">${c.gsub}</div>`:''}${c.sub?`<div class="sub">${c.sub}</div>`:''}${c.ex&&!c.word&&!c.sent?`<div class="ex"><span>${c.ex[1]}</span> ${c.ex[0]}</div>`:c.ex?`<div class="ex"><span>${c.ex[1]}</span></div>`:''}<div class="small">🔊 눌러서 듣기</div></button>`).join('')}</div>
 <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn gr" id="nx">다 배웠어요! →</button></div></div>`;
 el.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{const c=b.cards[+x.dataset.c];Voice.say(c.say+(c.ex&&!c.word&&!c.sent?`. ${c.ex[0]}`:''));});

function chartHTML(cons){const V=['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];return `<div style="grid-column:1/-1;overflow:auto"><table class="chart"><tr><th></th>${V.map(v=>`<th>${v}</th>`).join('')}</tr>${cons.map(c=>`<tr><th>${c}</th>${V.map(v=>{const s=compose(c,v,'');return `<td data-say="${s}">${s}</td>`;}).join('')}</tr>`).join('')}</table><p class="small">글자를 누르면 소리가 나요. 가로로, 세로로 읽어 보세요.</p></div>`;}

 <p class="small">회색 글자 위를 손가락이나 펜으로 따라 써요. 획 순서(위→아래, 왼쪽→오른쪽)를 보호자가 알려 주세요. 종이 공책에도 3번씩 써 보면 더 좋아요.</p><canvas id="tc"></canvas>

// ---------- 그리기 패드 (연습장 / 따라 쓰기) ----------
function makePad(cv,o={}){const ctx=cv.getContext('2d');let strokes=[],cur=null,W=0,H=0;
 function bg(){ctx.clearRect(0,0,W,H);if(o.grid){ctx.strokeStyle='#EEF0F6';ctx.lineWidth=1;const g=34;for(let x=g;x<W;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=g;y<H;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}}
  if(o.lines){ctx.strokeStyle='#DCE3F2';ctx.lineWidth=1.5;for(let y=70;y<H;y+=70){ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(W-10,y);ctx.stroke();}}
  if(o.guide){const L=o.guide.length;const fs=Math.min(W*0.78/L*1.05,H*0.78);ctx.strokeStyle='#F1E7D6';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle='#E4DCCD';ctx.font=`${fs}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.guide,W/2,H/2+fs*0.04);}}
 function line(s){if(s.pts.length<1)return;ctx.strokeStyle=o.color||'#2D3047';ctx.lineWidth=o.width||3.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.pts[0][0]*W,s.pts[0][1]*H);s.pts.forEach(p=>ctx.lineTo(p[0]*W,p[1]*H));if(s.pts.length===1)ctx.lineTo(s.pts[0][0]*W+0.1,s.pts[0][1]*H);ctx.stroke();}
 function redraw(){bg();strokes.forEach(line);}
 function size(){const r=cv.getBoundingClientRect();if(!r.width)return;const d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);redraw();}
 const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}cur={pts:[pt(e)]};strokes.push(cur);redraw();});
 cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();const p=pt(e);const l=cur.pts[cur.pts.length-1];cur.pts.push(p);ctx.strokeStyle=o.color||'#2D3047';ctx.lineWidth=o.width||3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(l[0]*W,l[1]*H);ctx.lineTo(p[0]*W,p[1]*H);ctx.stroke();});
 const end=()=>{cur=null;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 if(window.ResizeObserver)new ResizeObserver(size).observe(cv);setTimeout(size,30);if(document.fonts&&o.guide)document.fonts.load('40px Jua').then(redraw).catch(()=>{});
 return {clear(){strokes=[];redraw();},undo(){strokes.pop();redraw();},count:()=>strokes.length};}

// ---------- 문제 풀이 ----------
function blockQuiz(el,b){const S=App.sess;const isKid=S.L.track==='hangul';const test=b.mode==='test';let i=0;const res=b.res=b.items.map(()=>null);let pad=null;
 const usePad=S.L.track==='m2'||S.L.track==='m3';
 el.innerHTML=`<div class="stage ${usePad?'withpad':''}"><div class="card qcard" id="qc"></div>${usePad?`<div class="card pad"><div class="padbar"><b>✏️ 연습장</b><span class="small">세로셈·그림으로 직접 풀어요</span><div class="sp"></div><button class="btn ghost sm" id="pu">↶</button><button class="btn ghost sm" id="pclr">지우기</button></div><canvas id="pc"></canvas><div class="small">손가락이나 터치펜으로 써요. 다음 문제로 넘어가면 깨끗해져요.</div></div>`:''}</div>`;
 if(usePad){pad=makePad($('#pc'),{grid:true});$('#pclr').onclick=()=>pad.clear();$('#pu').onclick=()=>pad.undo();}
 if(b.note)toast(b.note);
 const show=()=>{const it=b.items[i];let tries=0;let val=it.kind==='multi'?it.labels.map(()=>''):[''];let fi=0;let bsel={c:null,v:null,j:it.jongs?'없음':''};
  const qc=$('#qc');const head=`<div class="qhead"><span class="qnum">${b.title} ${i+1} / ${b.items.length}</span><div class="pbar"><i style="width:${i/b.items.length*100}%"></i></div>${test?'<span class="tag" style="background:var(--pu)">평가</span>':''}</div>`;
  let body=`<div class="qtext">${it.q}</div>`;
  if(it.say||it.kid)body+=`<div class="row" style="justify-content:center"><button class="speak" id="say">🔊 ${it.skill==='h_listen'||it.skill==='h_build'||it.speakAns?'다시 듣기':'문제 듣기'}</button></div>`;
  if(it.kind==='choice')body+=`<div class="choices">${it.choices.map((c,k)=>`<button data-k="${k}">${c.h}</button>`).join('')}</div>`;
  else if(it.kind==='dict')body+=`<div class="pad"><div class="padbar"><b>✏️ 여기에 써요</b><span class="small">공책에 써도 좋아요</span><div class="sp"></div><button class="btn ghost sm" id="dclr">지우기</button></div><canvas id="dc" style="height:230px"></canvas></div><div class="row" style="justify-content:center" id="dact"><button class="btn gr" id="dok">다 썼어요 → 정답 보기</button></div>`;
  else if(it.kind==='build')body+=`<div class="build"><div class="bprev" id="bp"></div><div class="tiles"><div class="lab">첫소리 (자음)</div>${it.cons.map(c=>`<button data-bc="${c}">${c}</button>`).join('')}</div><div class="tiles"><div class="lab">가운데 소리 (모음)</div>${it.vows.map(c=>`<button data-bv="${c}">${c}</button>`).join('')}</div>${it.jongs?`<div class="tiles"><div class="lab">받침</div>${it.jongs.map(c=>`<button class="${c==='없음'?'t2 on':''}" data-bj="${c}">${c}</button>`).join('')}</div>`:''}<button class="btn gr" id="bok">다 만들었어요!</button></div>`;
  else body+=`<div class="answer">${val.map((_,k)=>`<div class="afield ${k===0?'on':''}" data-f="${k}"></div>${it.kind==='multi'?`<span class="alabel">${it.labels[k]}</span>`:''}`).join('')}</div><div class="keypad">${['7','8','9','⌫','4','5','6',it.kind==='multi'?'→':'','1','2','3','.','0','00','','✔'].map(k=>k===''?'<span></span>':`<button data-key="${k}" class="${k==='✔'?'ok':''}" ${k==='.'&&!it.dec?'style="visibility:hidden"':''}>${k==='✔'?'확인':k}</button>`).join('')}</div>`;
  const tools=`<div class="qtools">${!test&&it.hint?'<button class="btn ghost sm" id="hint">💡 힌트</button>':''}${it.col&&!test?'<button class="btn ghost sm" id="colb">✏️ 세로셈 틀 보기</button>':''}</div><div id="hb"></div>`;
  qc.innerHTML=head+body+tools;if(pad)pad.clear();
  const speakIt=()=>Voice.say(it.say||'');if(it.say)setTimeout(speakIt,250);const sb=$('#say');if(sb)sb.onclick=speakIt;
  const hb=$('#hint');if(hb)hb.onclick=()=>{$('#hb').innerHTML=`<div class="hintbox">💡 ${it.hint}</div>`;};
  const cb=$('#colb');if(cb)cb.onclick=()=>{$('#hb').innerHTML=`<div class="hintbox center">${vert(it.col[0],it.col[1],it.col[2])}<div class="small">연습장에 이렇게 자리를 맞춰 써서 풀어 보세요.</div></div>`;};
  const fields=()=>qc.querySelectorAll('.afield').forEach((f,k)=>{f.textContent=val[k];f.classList.toggle('on',k===fi);});
  qc.querySelectorAll('.afield').forEach(f=>f.onclick=()=>{fi=+f.dataset.f;fields();});
  qc.querySelectorAll('[data-key]').forEach(k=>k.onclick=()=>{const key=k.dataset.key;
   if(key==='⌫')val[fi]=val[fi].slice(0,-1);else if(key==='→')fi=(fi+1)%val.length;else if(key==='✔'){if(val.some(v=>v===''))return toast('답을 모두 써 주세요');submit(it.kind==='multi'?val.slice():val[0]);return;}
   else if(val[fi].length<7){if(key==='.'&&val[fi].includes('.'))return;val[fi]+=key;}fields();});
  qc.querySelectorAll('[data-k]').forEach(btn=>btn.onclick=()=>{const c=it.choices[+btn.dataset.k];btn.classList.add('sel');submit(c.v,btn);});
  if(it.kind==='dict'){const dp=makePad($('#dc'),{lines:true,width:3.6});$('#dclr').onclick=()=>dp.clear();$('#dok').onclick=()=>{$('#dact').innerHTML=`<div class="reveal" style="background:#EEF4FF;width:100%;text-align:center"><div class="small">정답</div><div class="jua" style="font-size:30px">${esc(it.a)}</div><div class="small">띄어쓰기·받침·문장 부호까지 맞았는지 같이 확인해요.</div></div><div class="row" style="justify-content:center;width:100%"><button class="btn gr" id="dyes">⭕ 맞게 썼어요</button><button class="btn ghost" id="dno">❌ 틀린 곳이 있어요</button></div>`;
   $('#dyes').onclick=()=>{res[i]={ok:true};flash('⭐');setTimeout(advance,600);};$('#dno').onclick=()=>{res[i]={ok:false};toast('틀린 낱말을 공책에 3번 써 봐요');setTimeout(advance,900);};};}
  if(it.kind==='build'){const upd=()=>{const bp=$('#bp');bp.textContent=bsel.c&&bsel.v?compose(bsel.c,bsel.v,bsel.j==='없음'?'':bsel.j):(bsel.c||'')+(bsel.v||'');};
   qc.querySelectorAll('[data-bc]').forEach(x=>x.onclick=()=>{bsel.c=x.dataset.bc;qc.querySelectorAll('[data-bc]').forEach(y=>y.classList.toggle('on',y===x));upd();Voice.say(CNAME[bsel.c]||'');});
   qc.querySelectorAll('[data-bv]').forEach(x=>x.onclick=()=>{bsel.v=x.dataset.bv;qc.querySelectorAll('[data-bv]').forEach(y=>y.classList.toggle('on',y===x));upd();Voice.say(compose('ㅇ',bsel.v,''));});
   qc.querySelectorAll('[data-bj]').forEach(x=>x.onclick=()=>{bsel.j=x.dataset.bj;qc.querySelectorAll('[data-bj]').forEach(y=>y.classList.toggle('on',y===x));upd();});
   $('#bok').onclick=()=>{if(!bsel.c||!bsel.v)return toast('자음과 모음을 골라요');const s=compose(bsel.c,bsel.v,bsel.j==='없음'?'':bsel.j);submit(s);};}
  function check(v){if(Array.isArray(it.a))return it.a.every((x,k)=>Number(x)===Number(v[k]));if(it.kind==='num')return Number(v)===Number(it.a)&&v!=='';return String(v)===String(it.a);}
  function submit(v,btn){const ok=check(v);
   if(test){res[i]={ok,given:v};advance();return;}
   tries++;if(ok){if(res[i]===null)res[i]={ok:tries===1,given:v};if(btn)btn.classList.add('right');flash(tries===1?'⭐':'👍');if(isKid)Voice.say(pick(['잘했어요!','맞았어요!','최고예요!']));setTimeout(advance,isKid?1100:800);return;}
   if(btn){btn.classList.remove('sel');btn.classList.add('wrong');btn.disabled=true;}

function collect(S){const skills={},wrong=[];let pc=0,pt=0,tc=0,tt=0;

  if(b.mode==='test'){tt++;if(ok)tc++;}else{pt++;if(ok)pc++;}if(!ok)wrong.push(it.tag||it.skill);});});
 return {skills,wrong:wrong.slice(0,40),practice:{c:pc,t:pt},test:tt?{c:tc,t:tt,score:Math.round(tc/tt*100)}:null};}

 push(op){this.queue=this.queue.filter(q=>!(q.t===op.t&&q.id===op.id));this.queue.push(op);this.saveQ();this.flush();},
 async flush(){if(this.busy||!this.user||!this.queue.length)return;this.busy=true;
  try{while(this.queue.length){const q=this.queue[0];let res;
   if(q.op==='del')res=await this.sb.from(q.t).delete().eq('id',q.id);

   if(res.error)throw res.error;this.queue.shift();this.saveQ();}
